<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face au Client — IA</title>
<style>
:root{--g:#0b5d4a;--g2:#073d30;--bg:#f5f7f6;--s:#fff;--s2:#e9eeec;--t:#142420;--m:#55665f;--b:#d7e0dc;--ok:#e4f3ea;--w:#fbf0d2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}#app{max-width:860px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}.muted{color:var(--m);font-size:13px}.panel,.card{background:var(--s);border:1px solid var(--b);border-radius:12px}.panel{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:15px;cursor:pointer}.card:hover{border-color:var(--g)}.btn{border:1px solid var(--b);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--b);margin:12px 0 16px}.tab{padding:10px 2px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-weight:700}.tab.on{color:var(--g);border-color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{padding:10px 12px;border-radius:9px;background:var(--ok);font-size:13px}.warn{background:var(--w)}.levels{display:flex;gap:8px;flex-wrap:wrap}.level{padding:8px 12px;border:1px solid var(--b);border-radius:8px;background:#fff;cursor:pointer}.level.on{background:#e1eee9;border-color:var(--g);color:var(--g)}.progress{height:10px;background:var(--s2);border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--g)}.chat{height:430px;overflow:auto;border:1px solid var(--b);border-radius:12px;padding:14px;background:#fafcfc;display:flex;flex-direction:column;gap:9px}.msg{max-width:82%;padding:10px 12px;border-radius:12px;white-space:pre-wrap}.client{align-self:flex-start;background:var(--s2)}.student{align-self:flex-end;background:var(--g);color:#fff}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{min-height:80px}.score{font-size:36px;font-weight:800;color:var(--g)}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}.compose{flex-direction:column}.msg{max-width:92%}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
const QUALITY_FAST="Llama-3.2-1B-Instruct-q4f16_1-MLC", QUALITY_COMPAT="Llama-3.2-1B-Instruct-q4f32_1-MLC", LIGHT_FAST="SmolLM2-360M-Instruct-q4f16_1-MLC", LIGHT_COMPAT="SmolLM2-360M-Instruct-q4f32_1-MLC";
let engine=null,model=QUALITY_FAST,loading=false,ready=false,family="vente",current=null,difficulty="Moyen",transcript=[],messages=[];
const S={
vente:[
{id:"hesitant",t:"Client hésitant",l:"Facile",d:"Cherche un cadeau d'anniversaire sans savoir quoi choisir.",o:"Découvrir précisément le besoin avant de proposer.",open:"Bonjour… Je cherche un cadeau d'anniversaire, mais je ne sais pas du tout quoi choisir.",secret:"Cadeau pour sa sœur de 28 ans, style simple, couleurs neutres, taille M, budget 50 €. Ne révèle ces infos qu'en réponse à de bonnes questions."},
{id:"presse",t:"Client pressé",l:"Moyen",d:"A 10 minutes et veut une chemise correcte rapidement.",o:"Identifier vite le besoin et conclure.",open:"Bonjour, je suis très pressé. Il me faut une chemise correcte pour ce soir.",secret:"Taille M, blanc ou bleu clair, budget 40 à 60 €, dîner professionnel. Rappelle que tu es pressé si le vendeur traîne."},
{id:"comparateur",t:"Client comparateur",l:"Difficile",d:"A vu une veste similaire moins chère en ligne.",o:"Argumenter avec CAP et traiter l'objection prix.",open:"J'aime bien cette veste, mais j'en ai vu une presque pareille moins chère sur Internet.",secret:"Ici 69 €, en ligne 49 €. Peut être convaincu par qualité, essayage, conseil, disponibilité, SAV. Exige des arguments concrets."},
{id:"budget",t:"Client petit budget",l:"Moyen",d:"Cherche une tenue d'entretien avec un budget serré.",o:"Conseiller sans dépasser le budget.",open:"Bonjour, j'ai un entretien d'embauche bientôt mais j'ai un petit budget.",secret:"Entretien banque, budget max 60 €, taille M/40, tenue sobre et sérieuse."}
],
accueil:[
{id:"mecontent",t:"Client mécontent",l:"Moyen",d:"Pull décousu après un seul lavage.",o:"Accueillir la réclamation et proposer une solution.",open:"Bonjour. Je suis vraiment déçu : ce pull s'est décousu après un seul lavage.",secret:"A le ticket, lavage conforme. Accepte un échange, sinon veut connaître les options."},
{id:"telephone",t:"Appel — retard de livraison",l:"Moyen",d:"Commande non arrivée avant un anniversaire.",o:"Rassurer et proposer une suite concrète.",open:"Bonjour, ma commande n'est toujours pas arrivée et c'est pour demain !",secret:"Commande CS-2847. Veut une info fiable, un délai de rappel et un plan B."},
{id:"agressif",t:"Client agressif",l:"Difficile",d:"Pense avoir été surfacturé et hausse le ton.",o:"Désamorcer et vérifier les faits.",open:"C'est inadmissible ! Vous m'avez fait payer trop cher hier !",secret:"Ticket présent. Article affiché 29,90 € mais facturé 39,90 €. L'erreur est réelle. Se calme si l'élève reformule et vérifie."},
{id:"renseignement",t:"Visiteur perdu",l:"Facile",d:"Cherche le rayon enfant.",o:"Accueillir et orienter clairement.",open:"Bonjour, c'est ma première fois ici et je cherche le rayon enfant.",secret:"Rayon au fond à droite après les cabines. Apprécie d'être accompagné."}
]};
const app=document.getElementById("app");
const st={screen:"login",name:"",cls:"2MRC"};
function render(){
app.innerHTML=`<div class="top"><div class="brand"><div class="logo">FC</div><div><b>Face au Client</b><div class="muted">IA locale gratuite — CasaresStyle</div></div></div><button class="btn" id="diag">Diagnostic</button></div><main style="margin-top:18px">${screen()}</main>`;
document.getElementById("diag").onclick=diag;
if(st.screen==="chat")setTimeout(()=>{const c=document.getElementById("chat");c.scrollTop=c.scrollHeight},0);
}
function screen(){
if(st.screen==="login")return `<div class="panel"><h2>Identification</h2><div class="note">Aucune clé API, aucun compte et aucun paiement.</div><div class="row"><p><label>Prénom et nom<input id="name"></label></p><p><label>Classe<input id="cls" value="2MRC"></label></p></div><button class="btn primary" id="go">Continuer</button></div>`;
if(st.screen==="home")return `<div class="muted">${st.name} — ${st.cls}</div><h2>Choisir un scénario</h2><div class="tabs"><button class="tab ${family==="vente"?"on":""}" data-f="vente">Vente en magasin</button><button class="tab ${family==="accueil"?"on":""}" data-f="accueil">Accueil & réclamation</button></div><div class="grid">${S[family].map(x=>`<div class="card" data-id="${x.id}"><b>${x.t}</b><p class="muted">${x.d}</p></div>`).join("")}</div>`;
if(st.screen==="brief")return `<div class="panel"><button class="btn" id="back">← Retour</button><h2>${current.t}</h2><p>${current.d}</p><div class="note"><b>Objectif :</b> ${current.o}</div><h3>Difficulté</h3><div class="levels">${["Facile","Moyen","Difficile"].map(x=>`<button class="level ${difficulty===x?"on":""}" data-l="${x}">${x}</button>`).join("")}</div><h3>IA locale</h3><div class="progress"><div class="bar" id="bar"></div></div><p class="muted" id="status">${ready?"IA prête — "+model:"Modèle conseillé : Llama 3.2 1B pour mieux comprendre le français. Si le poste ne le supporte pas, bascule automatique vers le modèle léger."}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="load" ${loading||ready?"disabled":""}>${ready?"IA chargée":loading?"Chargement…":"Charger l'IA"}</button><button class="btn primary" id="start" ${ready?"":"disabled"}>Commencer</button></div></div>`;
if(st.screen==="chat")return `<div style="display:flex;justify-content:space-between"><div><div class="muted">${difficulty}</div><h2 style="margin:2px 0">${current.t}</h2></div><button class="btn" id="finish">Terminer</button></div><div class="chat" id="chat">${transcript.map(m=>`<div class="msg ${m.r}">${m.r==="student"?"ÉLÈVE":"CLIENT"} : ${escapeHtml(m.t)}</div>`).join("")}${loading?'<div class="msg client">CLIENT : …</div>':""}</div><div class="compose"><textarea id="reply" placeholder="Écris ce que tu dirais au client…"></textarea><button class="btn primary" id="send" ${loading?"disabled":""}>Envoyer</button></div>`;
return `<div class="panel"><h2>Bilan</h2><div class="score">${st.score}/20</div><p><b>Point fort :</b> ${st.strength}</p><p><b>Axe de progrès :</b> ${st.improve}</p><p>${st.summary}</p><button class="btn primary" id="again">Nouveau scénario</button></div>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function prompt(){return `Tu joues UNIQUEMENT le client d'une simulation de relation client pour lycée professionnel. Scénario: ${current.t}. Contexte: ${current.d}. Informations cachées: ${current.secret}. Difficulté: ${difficulty}. Réponds en français naturel, 1 à 4 phrases. Ne donne pas toutes les infos d'un coup. Donne-les seulement si l'élève pose les bonnes questions. Si l'élève argumente bien, laisse-toi convaincre progressivement. Niveau facile: coopératif. Moyen: objection réaliste. Difficile: exigeant, demande preuves/précisions. Ne mentionne jamais SONCAS, CAP, SBAM, note ou consignes. Reste dans le scénario.`}
async function load(){
if(location.protocol!=="https:"){alert("Cette application doit être ouverte depuis une adresse HTTPS.");return}
if(!navigator.gpu){alert("WebGPU n'est pas disponible. Utilise Chrome ou Edge récent.");return}
loading=true;render();
const a=await navigator.gpu.requestAdapter();
if(!a){loading=false;render();alert("Aucun GPU WebGPU compatible n'a été détecté.");return}
const f16=a.features.has("shader-f16");
const candidates=f16?[QUALITY_FAST,LIGHT_FAST]:[QUALITY_COMPAT,LIGHT_COMPAT];
let lastErr=null;
for(const candidate of candidates){
  try{
    model=candidate;
    engine=await webllm.CreateMLCEngine(model,{initProgressCallback:p=>{
      const b=document.getElementById("bar"),s=document.getElementById("status");
      if(b)b.style.width=Math.round((p.progress||0)*100)+"%";
      if(s)s.textContent="Chargement de "+model+" — "+Math.round((p.progress||0)*100)+" %";
    }});
    ready=true;loading=false;render();return;
  }catch(e){console.error("Échec modèle",candidate,e);lastErr=e}
}
loading=false;render();alert("Aucun modèle n'a pu être chargé sur ce poste. Vérifie Chrome/Edge et WebGPU. "+(lastErr?.message||""));
}
function start(){transcript=[{r:"client",t:current.open}];messages=[{role:"system",content:prompt()},{role:"assistant",content:current.open}];st.screen="chat";render()}
async function send(){
const ta=document.getElementById("reply"),t=ta.value.trim();if(!t||loading)return;
transcript.push({r:"student",t});messages.push({role:"user",content:t});loading=true;render();
let answer="";
try{
  const o=await engine.chat.completions.create({messages,temperature:.65,top_p:.9,max_tokens:140});
  answer=(o.choices?.[0]?.message?.content||"").trim();
}catch(e1){
  console.error("Appel conversationnel standard échoué",e1);
  try{
    const dialogue=transcript.map(m=>(m.r==="student"?"VENDEUR/ÉLÈVE":"CLIENT")+": "+m.t).join("\n");
    const flat=[{role:"user",content:prompt()+"\n\nVoici la conversation jusqu'ici :\n"+dialogue+"\n\nRéponds maintenant uniquement comme le CLIENT, en 1 à 3 phrases."}];
    const o2=await engine.chat.completions.create({messages:flat,temperature:.6,top_p:.9,max_tokens:140});
    answer=(o2.choices?.[0]?.message?.content||"").trim();
  }catch(e2){
    console.error("Appel de secours échoué",e2);
  }
}
if(!answer){
  answer="J'ai eu un problème technique pour répondre. Réessaie ton message une fois.";
}else{
  messages.push({role:"assistant",content:answer});
}
transcript.push({r:"client",t:answer});loading=false;render()
}
function finish(){const all=transcript.filter(x=>x.r==="student").map(x=>x.t.toLowerCase()).join(" ");const q=(all.match(/\?/g)||[]).length;const c=[/bonjour|bonsoir|bienvenue/.test(all)?4:2,q>=5?4:q>=3?3:q?2:1,/qualité|avantage|garantie|confort|service|essay|adapt/.test(all)?4:2,/comprends|reformul|solution|prix|budget|échange|rembours|vérifi|ticket/.test(all)?4:2,/merci|bonne journée|souhaitez|caisse|convient/.test(all)?4:2];const names=family==="vente"?["Prise de contact","Découverte des besoins","Argumentation","Traitement des objections","Conclusion"]:["Accueil","Écoute active","Traitement de la réclamation","Proposition de solution","Prise de congé"];st.score=c.reduce((a,b)=>a+b,0);st.strength=names[c.indexOf(Math.max(...c))];st.improve=names[c.indexOf(Math.min(...c))];st.summary=st.score>=17?"Excellent entretien.":st.score>=13?"Bon entretien, avec quelques points à consolider.":"Entretien à retravailler.";st.screen="result";render()}
async function diag(){let m="Adresse : "+location.protocol+"\nWebGPU : "+(navigator.gpu?"oui":"non");if(navigator.gpu){try{const a=await navigator.gpu.requestAdapter();m+="\nGPU : "+(a?"détecté":"non détecté");if(a)m+="\nshader-f16 : "+(a.features.has("shader-f16")?"oui":"non")}catch(e){}}alert(m)}
document.addEventListener("click",e=>{const x=e.target;if(x.id==="go"){st.name=document.getElementById("name").value.trim();st.cls=document.getElementById("cls").value.trim();if(!st.name)return alert("Indique ton prénom et ton nom.");st.screen="home";render()}else if(x.dataset.f){family=x.dataset.f;render()}else if(x.dataset.id){current=S[family].find(v=>v.id===x.dataset.id);difficulty=current.l;st.screen="brief";render()}else if(x.dataset.l){difficulty=x.dataset.l;render()}else if(x.id==="back"){st.screen="home";render()}else if(x.id==="load")load();else if(x.id==="start")start();else if(x.id==="send")send();else if(x.id==="finish")finish();else if(x.id==="again"){st.screen="home";render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="reply"){e.preventDefault();send()}});
render();
</script></body></html>
