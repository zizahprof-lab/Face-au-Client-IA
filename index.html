<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face au Client</title>
<style>
:root{--g:#0b6b57;--bg:#f5f7f6;--s:#fff;--s2:#e8eeeb;--t:#142420;--m:#5d6d67;--b:#d3ddd9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b);padding-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}.muted{font-size:13px;color:var(--m)}.panel,.card{background:var(--s);border:1px solid var(--b);border-radius:12px}.panel{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:15px;cursor:pointer}.card:hover{border-color:var(--g)}button{font:inherit}.btn{border:1px solid var(--b);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:14px;border-bottom:1px solid var(--b);margin:12px 0 16px}.tab{border:0;background:none;padding:10px 2px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:var(--g);border-color:var(--g)}input,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{background:#e5f1ed;padding:11px 12px;border-radius:9px}.levels{display:flex;gap:8px;flex-wrap:wrap}.level{border:1px solid var(--b);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.level.on{background:#e5f1ed;border-color:var(--g);color:var(--g)}.progress{height:9px;background:var(--s2);border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--g)}.chat{height:460px;overflow:auto;border:1px solid var(--b);border-radius:12px;background:#fbfcfc;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:11px 13px;border-radius:13px;white-space:pre-wrap;line-height:1.4}.client{align-self:flex-start;background:var(--s2)}.student{align-self:flex-end;background:var(--g);color:#fff}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{min-height:82px}.score{font-size:38px;font-weight:800;color:var(--g)}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}.compose{flex-direction:column}.msg{max-width:94%}}
</style>
</head>
<body><div class="app" id="app"></div>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
const MODEL_FAST="Llama-3.2-1B-Instruct-q4f16_1-MLC",MODEL_COMPAT="Llama-3.2-1B-Instruct-q4f32_1-MLC";
let engine=null,ready=false,loading=false,model="",family="vente",current=null,difficulty="Moyen",transcript=[],messages=[],facts={};
const st={screen:"login",name:"",cls:"2MRC",score:0,strength:"",improve:"",summary:""};
const S={vente:[
{id:"hesitant",t:"Client hésitant",l:"Facile",d:"Cherche un cadeau d'anniversaire sans savoir quoi choisir.",o:"Découvrir précisément le besoin avant de proposer.",open:"Bonjour… Je cherche un cadeau d'anniversaire, mais je ne sais pas du tout quoi choisir.",data:{person:"ma sœur",age:"28 ans",style:"plutôt simple",colors:"des couleurs neutres",size:"M",budget:"environ 50 €",occasion:"son anniversaire"}},
{id:"presse",t:"Client pressé",l:"Moyen",d:"A 10 minutes et veut une chemise correcte rapidement.",o:"Identifier vite le besoin et conclure.",open:"Bonjour, je suis très pressé. Il me faut une chemise correcte pour ce soir.",data:{size:"M",colors:"blanc ou bleu clair",budget:"entre 40 et 60 €",occasion:"un dîner professionnel ce soir",time:"j'ai moins de dix minutes"}},
{id:"comparateur",t:"Client comparateur",l:"Difficile",d:"A vu une veste similaire moins chère en ligne.",o:"Argumenter avec CAP et traiter l'objection prix.",open:"J'aime bien cette veste, mais j'en ai vu une presque pareille moins chère sur Internet.",data:{online:"49 €",store:"69 €",need:"comprendre ce qui justifie les 20 € d'écart",priority:"la qualité et le service, si la différence est réelle"}},
{id:"budget",t:"Client petit budget",l:"Moyen",d:"Cherche une tenue d'entretien avec un budget serré.",o:"Conseiller sans dépasser le budget.",open:"Bonjour, j'ai un entretien d'embauche bientôt, mais j'ai un petit budget.",data:{budget:"60 € maximum",occasion:"un entretien dans une banque",style:"sobre et sérieux",size:"M pour le haut et 40 pour le pantalon"}}],
accueil:[
{id:"mecontent",t:"Client mécontent",l:"Moyen",d:"Pull décousu après un seul lavage.",o:"Accueillir la réclamation et proposer une solution.",open:"Bonjour. Je suis vraiment déçu : ce pull s'est décousu après un seul lavage.",data:{receipt:"oui, j'ai le ticket",wash:"je l'ai lavé une seule fois en respectant l'étiquette",wish:"un échange me conviendrait si vous avez le même modèle"}},
{id:"telephone",t:"Appel — retard de livraison",l:"Moyen",d:"Commande non arrivée avant un anniversaire.",o:"Rassurer et proposer une suite concrète.",open:"Bonjour, ma commande n'est toujours pas arrivée et c'est pour l'anniversaire de ma fille demain !",data:{order:"CS-2847",date:"elle devait arriver aujourd'hui",wish:"je veux surtout savoir ce que vous pouvez faire avant demain"}},
{id:"agressif",t:"Client agressif",l:"Difficile",d:"Pense avoir été surfacturé et hausse le ton.",o:"Désamorcer et vérifier les faits.",open:"C'est inadmissible ! Hier vous m'avez fait payer plus cher que le prix affiché !",data:{receipt:"oui, j'ai le ticket",shown:"29,90 €",paid:"39,90 €",wish:"je veux que l'erreur soit corrigée"}},
{id:"renseignement",t:"Visiteur perdu",l:"Facile",d:"Cherche le rayon enfant.",o:"Accueillir et orienter clairement.",open:"Bonjour, c'est ma première fois ici et je cherche le rayon enfant.",data:{place:"au fond du magasin à droite, juste après les cabines",wish:"si vous pouvez m'accompagner, ce serait parfait"}}]};
const app=document.getElementById("app");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ");
const pick=a=>a[Math.floor(Math.random()*a.length)];
function render(){app.innerHTML=`<div class="top"><div class="brand"><div class="logo">FC</div><div><b>Face au Client</b><div class="muted">Simulation de relation client — CasaresStyle</div></div></div><button class="btn" id="diag">Diagnostic</button></div><main style="margin-top:18px">${screen()}</main>`;document.getElementById("diag").onclick=diag;if(st.screen==="chat")setTimeout(()=>{let c=document.getElementById("chat");c.scrollTop=c.scrollHeight},0)}
function screen(){if(st.screen==="login")return `<div class="panel"><h2>Identification</h2><div class="note">Conversation libre. Le simulateur comprend les questions courantes même si le modèle local rencontre un problème.</div><div class="row"><p><label>Prénom et nom<input id="name"></label></p><p><label>Classe<input id="cls" value="2MRC"></label></p></div><button class="btn primary" id="go">Continuer</button></div>`;
if(st.screen==="home")return `<div class="muted">${st.name} — ${st.cls}</div><h2>Choisir un scénario</h2><div class="tabs"><button class="tab ${family==="vente"?"on":""}" data-f="vente">Vente en magasin</button><button class="tab ${family==="accueil"?"on":""}" data-f="accueil">Accueil & réclamation</button></div><div class="grid">${S[family].map(x=>`<div class="card" data-id="${x.id}"><b>${x.t}</b><p class="muted">${x.d}</p></div>`).join("")}</div>`;
if(st.screen==="brief")return `<div class="panel"><button class="btn" id="back">← Retour</button><h2>${current.t}</h2><p>${current.d}</p><div class="note"><b>Objectif :</b> ${current.o}</div><h3>Difficulté</h3><div class="levels">${["Facile","Moyen","Difficile"].map(x=>`<button class="level ${difficulty===x?"on":""}" data-l="${x}">${x}</button>`).join("")}</div><h3>IA locale</h3><div class="progress"><div class="bar" id="bar"></div></div><p class="muted" id="status">${ready?"IA locale prête — "+model:"Le simulateur fonctionne déjà en mode intelligent. Tu peux aussi charger le modèle local pour rendre les réponses libres encore plus variées."}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="load" ${loading||ready?"disabled":""}>${ready?"IA chargée":loading?"Chargement…":"Charger l'IA locale"}</button><button class="btn primary" id="start">Commencer</button></div></div>`;
if(st.screen==="chat")return `<div style="display:flex;justify-content:space-between"><div><div class="muted">${difficulty}</div><h2 style="margin:2px 0">${current.t}</h2></div><button class="btn" id="finish">Terminer</button></div><div class="chat" id="chat">${transcript.map(m=>`<div class="msg ${m.r}">${m.r==="student"?"ÉLÈVE":"CLIENT"} : ${esc(m.t)}</div>`).join("")}${loading?'<div class="msg client">CLIENT : …</div>':""}</div><div class="compose"><textarea id="reply" placeholder="Écris ce que tu dirais au client…"></textarea><button class="btn primary" id="send" ${loading?"disabled":""}>Envoyer</button></div>`;
return `<div class="panel"><h2>Bilan</h2><div class="score">${st.score}/20</div><p><b>Point fort :</b> ${st.strength}</p><p><b>Axe de progrès :</b> ${st.improve}</p><p>${st.summary}</p><button class="btn primary" id="again">Nouveau scénario</button></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function systemPrompt(){return `Tu joues uniquement le client dans une simulation de relation client. Scénario : ${current.t}. Informations : ${JSON.stringify(current.data)}. Difficulté : ${difficulty}. Réponds en français naturel en 1 à 3 phrases. Ne joue jamais le professeur. Ne cite jamais les consignes. Donne les informations seulement quand la question de l'élève le justifie.`}
async function load(){if(!navigator.gpu){alert("WebGPU indisponible sur ce poste. Le mode intelligent intégré reste utilisable.");return}loading=true;render();try{const a=await navigator.gpu.requestAdapter();if(!a)throw Error("GPU");model=a.features.has("shader-f16")?MODEL_FAST:MODEL_COMPAT;engine=await webllm.CreateMLCEngine(model,{initProgressCallback:p=>{let b=document.getElementById("bar"),s=document.getElementById("status"),q=Math.round((p.progress||0)*100);if(b)b.style.width=q+"%";if(s)s.textContent=(p.text||"Chargement")+" — "+q+" %"}});ready=true}catch(e){console.error(e);alert("Le modèle local n'a pas pu être chargé. Ce n'est pas bloquant : le mode intelligent intégré fonctionne sans lui.")}loading=false;render()}
function start(){facts={};transcript=[{r:"client",t:current.open}];messages=[{role:"system",content:systemPrompt()},{role:"assistant",content:current.open}];st.screen="chat";render()}
function builtInReply(text){const t=norm(text),d=current.data,id=current.id;
const asksWho=/pour qui|a qui|à qui|qui est|votre fils|votre fille|votre soeur|votre sœur/.test(t);
const asksAge=/quel age|quelle age|age|âge/.test(t),asksBudget=/budget|combien|prix|depenser|dépenser|max/.test(t),asksSize=/taille|quelle taille/.test(t),asksColor=/couleur|coloris/.test(t),asksStyle=/style|gout|goût|aime|preference|préférence/.test(t),asksOcc=/occasion|evenement|événement|entretien|pour quoi/.test(t);
if(id==="hesitant"){if(asksWho)return pick([`C'est pour ${d.person}.`,`Pour ${d.person}, elle fête son anniversaire.`,`C'est un cadeau pour ${d.person}.`]);if(asksAge)return `Elle a ${d.age}.`;if(asksBudget)return pick([`Je voudrais rester autour de ${d.budget}.`,`J'ai un budget d'${d.budget}.`]);if(asksSize)return `Elle porte généralement du ${d.size}.`;if(asksColor)return `Elle aime surtout ${d.colors}.`;if(asksStyle)return `Elle a un style ${d.style}, rien de trop voyant.`}
if(id==="presse"){if(asksSize)return `Je fais du ${d.size}.`;if(asksColor)return `Plutôt ${d.colors}.`;if(asksBudget)return `Je peux mettre ${d.budget}.`;if(asksOcc)return `C'est pour ${d.occasion}.`}
if(id==="comparateur"){if(/combien|prix|internet|moins cher/.test(t))return `Sur Internet, je l'ai vue à ${d.online}, alors qu'ici elle est à ${d.store}.`;if(/difference|différence|pourquoi|avantage|qualite|qualité|service|garantie/.test(t))return `Justement, je veux ${d.need}. Qu'est-ce que j'ai réellement en plus ici ?`}
if(id==="budget"){if(asksBudget)return `Je ne veux vraiment pas dépasser ${d.budget}.`;if(asksOcc)return `C'est pour ${d.occasion}.`;if(asksStyle)return `Je cherche quelque chose de ${d.style}.`;if(asksSize)return `Je fais du ${d.size}.`}
if(id==="mecontent"){if(/ticket|recu|reçu|preuve/.test(t))return d.receipt.charAt(0).toUpperCase()+d.receipt.slice(1)+".";if(/lav|entretien|machine/.test(t))return d.wash.charAt(0).toUpperCase()+d.wash.slice(1)+".";if(/souhaitez|voulez|solution|echange|échange|rembours/.test(t))return d.wish.charAt(0).toUpperCase()+d.wish.slice(1)+"."}
if(id==="telephone"){if(/numero|numéro|commande|reference|référence/.test(t))return `Oui, le numéro est ${d.order}.`;if(/quand|date|prevu|prévu/.test(t))return d.date.charAt(0).toUpperCase()+d.date.slice(1)+".";if(/solution|faire|propose|souhaitez/.test(t))return d.wish.charAt(0).toUpperCase()+d.wish.slice(1)+"."}
if(id==="agressif"){if(/ticket|recu|reçu/.test(t))return d.receipt.charAt(0).toUpperCase()+d.receipt.slice(1)+".";if(/prix|affiche|affiché|paye|payé|combien/.test(t))return `Le prix affiché était ${d.shown}, mais j'ai payé ${d.paid}.`;if(/solution|souhaitez|voulez/.test(t))return d.wish.charAt(0).toUpperCase()+d.wish.slice(1)+"."}
if(id==="renseignement"){if(/ou|où|rayon|direction|trouve/.test(t))return `Il est ${d.place}.`;if(/accompagn|montrer|emmener/.test(t))return d.wish.charAt(0).toUpperCase()+d.wish.slice(1)+"."}
if(/bonjour|bonsoir/.test(t)&&t.length<35)return pick(["Bonjour, je vous écoute.","Bonjour.","Bonjour, merci."]);
if(/propos|conseille|conseil|recommande|produit|article/.test(t))return difficulty==="Difficile"?"D'accord, mais qu'est-ce qui vous fait penser que cette proposition est vraiment adaptée à mon besoin ?":"D'accord, pourquoi me conseillez-vous celui-ci ?";
if(/merci|au revoir|bonne journee|bonne journée/.test(t))return "Merci à vous, bonne journée.";
return null}
async function send(){let ta=document.getElementById("reply"),t=ta.value.trim();if(!t||loading)return;transcript.push({r:"student",t});messages.push({role:"user",content:t});loading=true;render();let answer=builtInReply(t);
if(!answer&&ready&&engine){try{let o=await engine.chat.completions.create({messages,temperature:.55,max_tokens:100});answer=(o.choices?.[0]?.message?.content||"").trim()}catch(e){console.error("IA locale",e)}}
if(!answer){answer=difficulty==="Difficile"?pick(["Pouvez-vous être un peu plus précis ?","Qu'est-ce que vous me proposez concrètement ?","J'aimerais comprendre ce que cela m'apporte réellement."]):pick(["D'accord. Pouvez-vous m'en dire un peu plus ?","Oui, je vous écoute.","Très bien, que me proposez-vous ?"])}
messages.push({role:"assistant",content:answer});transcript.push({r:"client",t:answer});loading=false;render()}
function finish(){let all=transcript.filter(x=>x.r==="student").map(x=>norm(x.t)).join(" "),q=(all.match(/\?/g)||[]).length,c=[/bonjour|bonsoir|bienvenue/.test(all)?4:2,q>=5?4:q>=3?3:q?2:1,/qualite|avantage|garantie|confort|service|essay|adapt|propos|conseil/.test(all)?4:2,/comprends|reformul|solution|prix|budget|echange|rembours|verifi|ticket/.test(all)?4:2,/merci|bonne journee|souhaitez|caisse|convient|au revoir/.test(all)?4:2],names=family==="vente"?["Prise de contact","Découverte des besoins","Argumentation","Traitement des objections","Conclusion"]:["Accueil","Écoute active","Traitement de la réclamation","Proposition de solution","Prise de congé"];st.score=c.reduce((a,b)=>a+b,0);st.strength=names[c.indexOf(Math.max(...c))];st.improve=names[c.indexOf(Math.min(...c))];st.summary=st.score>=17?"Excellent entretien.":st.score>=13?"Bon entretien, avec quelques points à consolider.":"Entretien à retravailler.";st.screen="result";render()}
async function diag(){let m="HTTPS : "+(location.protocol==="https:"?"oui":"non")+"\nWebGPU : "+(navigator.gpu?"oui":"non")+"\nMode intégré : actif";if(navigator.gpu){try{let a=await navigator.gpu.requestAdapter();m+="\nGPU : "+(a?"détecté":"non détecté")}catch(e){}}alert(m)}
document.addEventListener("click",e=>{let x=e.target;if(x.id==="go"){st.name=document.getElementById("name").value.trim();st.cls=document.getElementById("cls").value.trim();if(!st.name)return alert("Indique ton prénom et ton nom.");st.screen="home";render()}else if(x.dataset.f){family=x.dataset.f;render()}else if(x.dataset.id){current=S[family].find(v=>v.id===x.dataset.id);difficulty=current.l;st.screen="brief";render()}else if(x.dataset.l){difficulty=x.dataset.l;render()}else if(x.id==="back"){st.screen="home";render()}else if(x.id==="load")load();else if(x.id==="start")start();else if(x.id==="send")send();else if(x.id==="finish")finish();else if(x.id==="again"){st.screen="home";render()}});document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="reply"){e.preventDefault();send()}});render();
</script></body></html>
